<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود</title>
    <link rel="shortcut icon" href="/assets/svgexport-2.svg">
  <script type="module" crossorigin src="/assets/main2.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main.css">
</head>
<body class="register-login-body">
<!-- Spinner (hidden after load) -->
<div id="loading-spinner" class="parent-spinner">
    <div class="spinner spinner-border"></div>
</div>

<!-- Form Wrapper -->
<div class="parent-img-title-form">
    <!-- Logo -->
    <div class="parent-img">
        <img src="/assets/svgexport-2.svg" alt="لوگو">
    </div>

    <!-- Title -->
    <h5 class="register-login-title-form">ورود</h5>

    <!-- Form -->
    <form class="register-login-form">

        <!-- Email -->
        <div class="parent-input group">
            <div class="text-gray-400 group-focus-within:text-public parent-icon-input">
                <i class="fa-regular fa-envelope"></i>
            </div>
            <input name="email" type="email" class="input-register-login" placeholder="ایمیل" required>
        </div>

        <!-- Password -->
        <div class="parent-input group">
            <div class="text-gray-400 group-focus-within:text-public parent-icon-input">
                <i class="fa-regular fa-lock-alt"></i>
            </div>
            <input name="password" id="password" type="password" class="input-register-login" placeholder="رمز عبور" required>
            <!-- دکمه نمایش/مخفی کردن -->
            <button type="button" class="icon-eye-password" onclick="togglePasswordVisibility(this)">
                <i id="togglePasswordIcon" class="fa-regular fa-eye"></i>
            </button>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="box-remember-forgotPassword">
            <div class="checkbox-container">
                <input type="checkbox" id="rememberMe" class="custom-checkbox">
                <label for="rememberMe" class="checkbox-label">
                    <span class="checkmark">
                            <i class="fas fa-check"></i>
                    </span>
                    <span class="text">مرا به خاطر بسپار</span>
                </label>
            </div>
            <a href="./forget-password.html" class="link-forgotPassword">رمز عبور را فراموش کرده‌ام؟</a>
        </div>

        <!-- Submit Button -->
        <button name="submit" type="submit" class="submit-register-login">ورود</button>

        <hr class="border-register-login">

        <!-- Login Link -->
        <div class="parent-link-register-login">
            <p class="question-account-register-login">حسابی ندارید؟</p>
            <a href="./register.html" class="answer-register-login">اکنون ثبت نام کنید!</a>
        </div>
    </form>
</div>


</body>
</html>
